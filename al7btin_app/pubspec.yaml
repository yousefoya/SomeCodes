name: al7btin_app
description: "بتنحل (AL7BTIN) - Production Multi-Service Delivery & Home-Services Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Networking & Persistence
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
